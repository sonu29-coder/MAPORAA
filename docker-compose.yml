version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: maporaa_db
    restart: always
    environment:
      POSTGRES_USER: maporaa
      POSTGRES_PASSWORD: maporaa_password
      POSTGRES_DB: maporaa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maporaa_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://maporaa:maporaa_password@db:5432/maporaa
      - SECRET_KEY=maporaa-production-docker-secret-key-2026
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maporaa_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
